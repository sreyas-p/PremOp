[project]
name = "knowledge"
version = "0.1.0"
description = "A compounding knowledge base — observations consolidate into beliefs that reinforce, supersede, and decay"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.8.0", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
mlx = ["mlx-embeddings>=0.0.3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["knowledge*"]
