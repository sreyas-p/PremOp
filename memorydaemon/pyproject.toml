[project]
name = "memorydaemon"
version = "0.1.0"
description = "Weight-based memory for open-weight models: wake-phase edits, sleep-phase consolidation, versioned and auditable"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.8.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
# The MLX engine. Installed separately so the runtime stays importable
# (and testable) on machines without Apple Silicon.
mlx = ["mlx>=0.18.0", "mlx-lm>=0.19.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["memorydaemon*"]
